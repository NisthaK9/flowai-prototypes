  :root{
    --teal:#007f99; --teal-dark:#00464c; --lime:#c8f050;
    --text:rgba(0,0,0,.85); --muted:#999; --bg:#f5f7f8; --card:#fff;
    --chip:#f0f3f5; --chip-active:#e1f1f4; --border:#e6e8ea; --border-2:#d9dde0;
    --danger:#e4572e; --warn:#f6a623; --success:#3fae4a; --link:#1f87a0;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; }
  body{
    font-family:'Lato',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:#e6e8ee; color:var(--text);
    display:flex; flex-direction:column; min-height:100vh;
  }
  .stage{ flex:1; display:flex; align-items:center; justify-content:center; padding:24px; }
  button{ font-family:inherit; cursor:pointer; border:none; background:none; padding:0; color:inherit; }
  input,select,textarea{ font-family:inherit; }
  p,h1,h2,h3{ margin:0; }
  .muted{ color:var(--muted); }

  /* Phone frame */
  .phone{ position:relative; width:390px; height:844px; border-radius:52px; background:#000; padding:14px; box-shadow:0 30px 60px rgba(0,0,0,.35); }
  .screen-wrap{ position:relative; width:100%; height:100%; border-radius:38px; background:#fff; overflow:hidden; display:flex; flex-direction:column; }
  .notch{ position:absolute; top:0; left:50%; transform:translateX(-50%); width:126px; height:28px; background:#000; border-radius:0 0 16px 16px; z-index:20; }

  /* Demo control bar — Manifest DemoSwitcher style */
  .demobar{ width:100%; background:#1a1a2e; border-bottom:2px solid #2d2d4e; padding:8px 14px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; z-index:100; }
  .db-back{ display:flex; align-items:center; gap:5px; font-size:11px; font-weight:600; color:#6B7EB5; text-decoration:none; padding:4px 10px; border-radius:6px; border:1px solid rgba(107,126,181,.3); white-space:nowrap; transition:color .15s ease,border-color .15s ease; }
  .db-back:hover{ color:#fff; border-color:rgba(255,255,255,.3); }
  .db-title{ font-size:10px; font-weight:700; color:#6B7EB5; text-transform:uppercase; letter-spacing:.12em; white-space:nowrap; }
  .db-tab{ display:flex; align-items:center; gap:5px; padding:5px 12px; border-radius:100px; border:1.5px solid transparent; background:rgba(255,255,255,.07); color:#8899BB; font-size:12px; font-weight:400; white-space:nowrap; transition:all .15s ease; }
  .db-tab:hover{ color:#c3cee6; }
  .db-tab.on{ font-weight:700; }
  .db-tab .dot{ width:7px; height:7px; border-radius:50%; flex-shrink:0; display:inline-block; }
  .db-toggle{ padding:4px 12px; border-radius:100px; font-size:11px; font-weight:600; white-space:nowrap; background:rgba(255,255,255,.08); color:#8899BB; transition:all .15s ease; }
  .db-toggle.on{ background:rgba(45,198,83,.15); color:#2DC653; }
  .db-share{ display:flex; align-items:center; gap:6px; padding:5px 12px; border-radius:100px; background:rgba(255,255,255,.07); color:#8899BB; font-size:12px; font-weight:600; white-space:nowrap; transition:all .15s ease; }
  .db-share svg{ width:13px; height:13px; }
  .db-share:hover,.db-share.on{ color:#fff; background:rgba(255,255,255,.14); }
  .db-sep{ width:1px; height:20px; background:#2d2d4e; margin:0 3px; flex-shrink:0; }
  .db-note{ margin-left:auto; font-size:10px; color:#4A5568; white-space:nowrap; padding-left:8px; }

  /* Login screen */
  .login{ height:100%; position:relative; overflow:hidden; display:flex; flex-direction:column; background:radial-gradient(55% 42% at 100% 100%, rgba(168,229,0,.42), rgba(168,229,0,.12) 45%, transparent 68%), radial-gradient(120% 70% at 50% 12%, rgba(200,240,80,.16), transparent 55%), linear-gradient(160deg,#00363c 0%,#00707f 52%,#14a4bd 110%); color:#fff; padding:0 28px; }
  .login-glow{ position:absolute; bottom:-90px; right:-80px; width:340px; height:340px; border-radius:50%; background:radial-gradient(circle,rgba(168,224,80,.4),transparent 70%); filter:blur(8px); pointer-events:none; z-index:0; }
  .login-orbits{ position:absolute; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  /* keep the neon droplets out of the form: cluster them in the top-left & bottom-right corners */
  .login-orbits .orbit{ position:absolute; border-radius:50%; pointer-events:none; animation:orbitSpin linear infinite; }
  .login-orbits .orbit:nth-child(odd){ left:0; top:0; }
  .login-orbits .orbit:nth-child(even){ left:100%; top:100%; }
  .login-orbits .drop{ position:absolute; top:-5px; left:50%; width:10px; height:10px; margin-left:-5px; border-radius:50%; background:#A8E500; box-shadow:0 0 10px 2px rgba(168,229,0,.65); }
  .login-in{ position:relative; z-index:1; flex:1; display:flex; flex-direction:column; }
  .login-field{ display:flex; align-items:center; gap:10px; background:rgba(255,255,255,.38); border:1px solid rgba(255,255,255,.55); border-radius:14px; padding:13px 15px; margin-bottom:12px; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
  .login-field input{ flex:1; background:transparent; border:none; outline:none; color:#fff; font-size:14px; }
  .login-field input::placeholder{ color:rgba(255,255,255,.6); }
  .login-btn{ width:100%; padding:15px; border-radius:14px; background:#fff; color:#00464c; font-size:15px; font-weight:900; box-shadow:0 12px 26px -10px rgba(0,0,0,.5); }
  .login-social{ display:flex; align-items:center; justify-content:center; gap:9px; width:100%; padding:13px; border-radius:14px; background:rgba(255,255,255,.22); border:1px solid rgba(255,255,255,.4); color:#fff; font-size:13.5px; font-weight:800; backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px); }
  .login-or{ display:flex; align-items:center; gap:12px; color:rgba(255,255,255,.55); font-size:11px; font-weight:700; margin:20px 0; }
  .login-or::before,.login-or::after{ content:''; flex:1; height:1px; background:rgba(255,255,255,.22); }

  /* Native share sheet */
  .ns-apps{ display:flex; gap:16px; overflow-x:auto; padding:6px 2px 14px; }
  .ns-apps::-webkit-scrollbar{ display:none; }
  .ns-app{ display:flex; flex-direction:column; align-items:center; gap:7px; flex-shrink:0; width:60px; }
  .ns-ic{ width:56px; height:56px; border-radius:15px; display:flex; align-items:center; justify-content:center; color:#fff; box-shadow:0 6px 14px -6px rgba(0,0,0,.3); }
  .ns-app span{ font-size:11px; color:#374151; font-weight:600; text-align:center; line-height:1.15; }
  .ns-actions{ background:#fff; border-radius:14px; overflow:hidden; }
  .ns-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%; padding:15px 16px; font-size:15px; font-weight:600; color:#111827; border-bottom:1px solid var(--border); text-align:left; }
  .ns-row:last-child{ border-bottom:none; }

  /* Empty state */
  .empty{ display:flex; flex-direction:column; align-items:center; text-align:center; padding:44px 26px; }
  .empty-ic{ width:78px; height:78px; border-radius:24px; display:flex; align-items:center; justify-content:center; background:linear-gradient(160deg,#e6f6f9,#d0f0da); color:var(--teal); margin-bottom:18px; box-shadow:0 12px 26px -12px rgba(0,127,153,.4); }
  .empty h3{ font-size:16px; font-weight:900; color:#0f2a2e; }
  .empty p{ font-size:12.5px; color:#6b7f83; margin-top:7px; line-height:1.5; max-width:230px; }
  .empty .ecta{ margin-top:20px; padding:11px 22px; border-radius:12px; background:linear-gradient(135deg,#00707f,#14a4bd); color:#fff; font-size:13px; font-weight:900; box-shadow:0 10px 22px -8px rgba(0,127,153,.55); }

  /* Toast */
  .toast{ position:absolute; left:50%; bottom:104px; transform:translateX(-50%); z-index:80; background:rgba(15,42,46,.95); color:#fff; font-size:13px; font-weight:700; padding:11px 18px; border-radius:100px; box-shadow:0 10px 26px -8px rgba(0,0,0,.5); white-space:nowrap; transition:opacity .3s ease; animation:toastIn .3s cubic-bezier(.22,1,.36,1); }
  @keyframes toastIn{ from{ opacity:0; transform:translate(-50%,10px);} to{ opacity:1; transform:translate(-50%,0);} }

  /* Shortlist fly-to-cart */
  .fly-dot{ position:fixed; z-index:9999; width:34px; height:34px; border-radius:50%; background:linear-gradient(135deg,#00707f,#16b8c9); display:flex; align-items:center; justify-content:center; box-shadow:0 8px 18px -6px rgba(0,127,153,.7); pointer-events:none; will-change:transform,opacity; }
  .cart-pop{ animation:cartPop .42s cubic-bezier(.3,1.5,.5,1); }
  @keyframes cartPop{ 0%{ transform:scale(1);} 38%{ transform:scale(1.3);} 100%{ transform:scale(1);} }
  .statusbar{ display:flex; align-items:center; justify-content:space-between; padding:16px 28px 4px; font-size:15px; font-weight:700; flex-shrink:0; }
  .statusbar .sb-icons{ display:flex; align-items:center; gap:6px; }
  .content{ flex:1; min-height:0; overflow-y:auto; position:relative; }
  .home-ind{ position:absolute; bottom:8px; left:50%; transform:translateX(-50%); width:134px; height:5px; border-radius:3px; background:rgba(0,0,0,.8); z-index:40; pointer-events:none; }

  /* Tab bar */
  .tabbar{ position:absolute; left:14px; right:14px; bottom:14px; z-index:30; display:flex; border-radius:100px; background:#fff; border:1px solid #eef0f2; box-shadow:0 14px 32px -8px rgba(0,60,70,.28); padding:7px 20px 8px; }
  .tab{ flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; color:#9aa3ad; font-size:10px; font-weight:600; }
  .tab.active{ color:var(--teal); }
  /* Search v2 dark pill nav + gooey liquid FAB */

function deadlineBucket(due){ const now=new Date('2026-07-08'); const d=new Date(due); if(isNaN(d)) return 'later'; const days=Math.round((d-now)/86400000); if(days<0) return 'overdue'; if(days<=30) return '30'; if(days<=90) return '90'; return 'later'; }

function studentBadges(id){
  const a = appsFor(id);
  const sub = a.filter(x=>x.tone!=='progress').length;
  const prog = a.filter(x=>x.tone==='progress').length;
  const out=[];
  if(sub>0) out.push([sub+' Submitted','submitted']);
  if(prog>0) out.push([prog+' In Progress','progress']);
  if(!out.length) out.push(['App. Incomplete','incomplete']);
  return out;
}

function fileMeta(name){
  const ext=(name.split('.').pop()||'').toUpperCase();
  const img=['PNG','JPG','JPEG','GIF','WEBP','HEIC'].includes(ext);

  return {ext,img,color,bg};
}

function render(focusId){

  if(S.auth==='out'){
    frame.innerHTML=`<div class="notch"></div>
      <div style="background:#00363c;flex-shrink:0">${statusbar(true)}</div>
      <div class="content" id="content">${screenLogin()}</div>
      <div class="home-ind" style="background:transparent"></div>`;
    startFlow();
    renderDemoBar();
    return;
  }
  let light=false, content='', bar='', overlay='', fab='';

  // light = white status-bar icons (gradient/teal header at top); headerLess = plain screens on light backdrop
  let headerLess=false;
  // priority pushed screens
  if(S.shareSent){ headerLess=true; content=screenCurated(); overlay=overlayShareSuccess(); }
  else if(S.shareStep==='curated'){ light=true; content=screenCurated(); if(S.recipientOpen) overlay=overlayRecipient(); }
  else if(S.shareStep==='review'){ light=true; content=screenShareReview(); }
  else if(S.commentsAppId){ light=true; content=screenComments(); }
  else if(S.notifOpen){ light=true; content=screenNotifications(); }
  else if(S.stub){ light=true; content=screenStub(); }
  else if(S.studentAppsId){ light=true; content=screenStudentApps(); }
  else if(S.detailId){ light=true; content=screenProfile(); }
  else if(S.addConfirm){ headerLess=true; content=screenAddConfirm(); }
  else if(S.appConfirm){ headerLess=true; content=screenAppConfirm(); }
  else if(S.deleted){ headerLess=true; content=screenDeleted(); }
  else if(S.tab==='search' && S.searching){ light=true; content=screenSearching(); }
  else if(S.tab==='search' && S.searchResults && S.openProgram){ light=true; content=screenProgram(); }
  else if(S.tab==='search' && S.searchResults){
    light=true; content=screenResults();
    if(S.eligibilityOpen) overlay=overlayEligibility();
    else if(S.shareStep==='menu') overlay=overlayShareMenu();
  }
  else if(S.results2 && S.openProgram){ light=true; content=screenProgram(); }
  else if(S.results2){
    light=true; content=screenResults2();
    if(S.moreFiltersOpen) overlay=overlayMoreFilters();
    else if(S.sortFilterOpen) overlay=overlaySortFilter();
    else if(S.eligibilityOpen) overlay=overlayEligibility();
    else if(S.shareStep==='menu') overlay=overlayShareMenu();
  }
  else {
    // tabbed — every tab now has a gradient header
    light = true;
    bar = S.tab==='searchv2' ? tabbarV2() : tabbar();
    if(S.tab==='students'){ content=tabStudents(); }
    else if(S.tab==='search'){ content=tabSearchForm(); }
    else if(S.tab==='searchv2'){ content=tabSearchV2(); }
    else if(S.tab==='applications'){ content=tabApplications(); }
    else if(S.tab==='bookmarks'){ content=tabBookmarks(); }
    else if(S.tab==='account'){ content=tabAccount(); }
    if(S.addOpen) overlay=overlayAdd();
    if(S.moreFiltersOpen) overlay=overlayMoreFilters();
    if(S.addAppOpen) overlay=overlayAddApp();
  }
  if(S.nativeShareOpen) overlay=overlayNativeShare();
  if(S.addAppOpen) overlay=overlayAddApp();
  const sbAttr = headerLess ? 'style="background:#eef5f7;flex-shrink:0"'
    : (light ? 'class="sbg" style="flex-shrink:0"' : 'style="background:#ffffff;flex-shrink:0"');
  frame.innerHTML = `<div class="notch"></div>
    <div ${sbAttr}>${statusbar(light)}</div>
    <div class="content" id="content">${content}</div>
    ${S.fabOpen?`<div class="fab-scrim" onclick="act('${S.tab==='searchv2'?'toggleFabV2':'toggleFab'}')"></div>`:''}
    ${bar}
    ${overlay}${fab}
    <div class="home-ind"></div>`;
  if(focusId){ const el=document.getElementById(focusId); if(el){ el.focus(); const v=el.value; el.value=''; el.value=v; } }
  if(S.searching) startFlow();
  if(document.getElementById('greetLine')) startGreet();
  renderDemoBar();
}

    students:{bg:'linear-gradient(160deg,#e9f8ee,#d0f0da)',ic:'linear-gradient(135deg,#33a457,#57c079)',text:'#1f6b3a',border:'rgba(47,158,87,.5)',glow:'rgba(47,158,87,.4)'},
  };
  const tile=(key,label,icon,count,hasNew,th)=>{const active=S.dashExpanded===key;return `<button class="dtile${active?' on':''}" onclick="act('dashExpand','${key}')" style="background:${th.bg};border:1.5px solid ${active?th.border:'rgba(255,255,255,.75)'};box-shadow:${active?`0 10px 22px -8px ${th.glow}`:'0 6px 16px -12px rgba(0,60,70,.22)'}"><span class="dtile-top"><span class="dtile-ic" style="background:${th.ic};color:#fff;box-shadow:0 5px 12px -4px ${th.glow}">${icon}</span><span class="dtile-count" style="color:${th.text}">${count}</span></span><span class="dtile-label" style="color:${th.text};opacity:.72">${label}</span>${hasNew?'<span class="dtile-dot"></span>':''}</button>`;};
  const tilesHTML=`<div class="dtiles">${tile('urgent','Urgent',urgentIcon,urgent.length,urgent.length>0,TT.urgent)}${tile('notifs','Notifications',I.bell,unread(),unread()>0,TT.notifs)}${tile('students','Students',peopleIcon,list.length,incomplete.length>0,TT.students)}</div>`;
  let expandedSection='';
  if(S.dashExpanded==='urgent') expandedSection=`<div class="dash-sec-head"><h2>Urgent Actions</h2><span class="dash-count">${urgent.length}</span></div>${urgent.length?urgent.map(ucard).join(''):'<p style="text-align:center;font-size:13px;color:#6b7f83;padding:24px 0">You are all caught up.</p>'}`;
  else if(S.dashExpanded==='notifs') expandedSection=`<div class="dash-sec-head"><h2>Notifications</h2><button class="link" onclick="act('openNotifs')">View all</button></div>${S.notifs.slice(0,5).map(nrow).join('')}`;

  return `
  <div class="mstu">
    <div class="mstu-hero">
      <div class="mstu-topbar"><h1 id="greetLine" class="greet-line">${greetMessages()[greetIdx]}</h1>
        <button class="glass-bell" onclick="act('openNotifs')">${I.bell}${unread()?`<span class="badge">${unread()}</span>`:''}</button>
      </div>
      <div class="mstu-search">
        <div class="glass-input">${wSearch}<input id="stuSearch" placeholder="Search name or email…" value="${esc(S.stuQuery)}" oninput="onStuSearch(this.value)"></div>
        <button class="glass-filter" onclick="act('stuFilterToggle')">${wFilter}${anyFilter?'<span class="dot"></span>':''}</button>
      </div>
      ${S.stuFilterOpen?`<div class="mstu-chips" style="margin-top:14px">
        ${anyFilter?`<button class="fpill clearpill" onclick="act('clearStuFilters')">✕ Clear all</button>`:`<button class="fpill allpill on">All</button>`}
        ${fsel('counsellor','Counsellor',COUNSELORS.map(c=>[c,c]))}
        ${fsel('program','Program',progOpts)}
        ${fsel('status','Application Status',statuses)}
        ${fsel('deadline','Deadline',deadlines)}
      </div>`:''}
    </div>
    <div class="mstu-list">
      ${showDash ? `${tilesHTML}${expandedSection}` : studentsBlock}
    </div>
  </div>`;
}

/* ---------- Notifications ---------- */
function notifIcon(t){
  const map={application:['var(--chip-active)','var(--teal)'],match:['#e6f7eb','#2a7a50'],document:['#eef2ff','#4361ee'],deadline:['#fef2e6','var(--warn)'],message:['var(--chip-active)','var(--teal)'],support:['#fef2e6','var(--warn)'],offer:['#f3e8ff','#7c3aed']};
  const [bg,fg]=map[t]||['#eef0f2','#55606e'];
  const icon=(t==='message'||t==='support')?I.msg:I.doc;
  return `<span style="width:40px;height:40px;border-radius:50%;background:${bg};color:${fg};display:flex;align-items:center;justify-content:center;flex-shrink:0">${icon}</span>`;
}

      const tappable=!!n.appId;
      const meta=n.student?`<p style="font-size:11px;font-weight:800;color:var(--teal);margin-top:3px">${esc(n.student)} · ${esc(n.course)}</p>`:'';
      return `<button onclick="act('openNotif','${n.id}')" style="width:100%;text-align:left;display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);background:${n.read?'#fff':'#eef7f9'}">

/* ---------- application progress timeline ---------- */
function appSteps(a){
  const idxByTone={progress:1, review:3, offer:5, accepted:5, closed:5, rejected:5};
  const cur = idxByTone[a.tone] ?? 1;
  const lastLabel = a.tone==='rejected' ? 'Decision — Not Received'
    : (a.tone==='offer'||a.tone==='accepted') ? 'Offer Received'
    : a.tone==='closed' ? 'Enrolled'
    : 'Awaiting Decision';
  const labels=['Application Created','Documents Submitted','Submitted to University','Under Review',lastLabel];
  const times=['09:15 AM','02:40 PM','11:05 AM','04:20 PM', a.tone==='rejected'?'—':'10:30 AM'];
  const dates=['12 Aug 2025','16 Aug 2025','22 Aug 2025','04 Sep 2025','18 Sep 2025'];
  return labels.map((label,i)=>{
    const state = i<cur ? 'done' : (i===cur ? 'current' : 'todo');
    const sub = state==='done' ? 'Completed · '+dates[i]
      : state==='current' ? 'In progress · '+dates[i]
      : 'Upcoming';
    return { label, time: state==='todo'?'':times[i], sub, state };
  });
}
function appTimeline(a){
  const steps=appSteps(a);
  return `<div class="vtl">${steps.map((st,i)=>{
    const last=i===steps.length-1;
    return `<div class="vtl-row">
      <div class="vtl-node"><span class="vtl-dot ${st.state}"></span>${last?'':`<span class="vtl-line ${st.state==='done'?'':'todo'}"></span>`}</div>
      <div class="vtl-body">
        <div class="vtl-top"><span class="vtl-title ${st.state==='todo'?'todo':''}">${st.label}</span>${st.time?`<span class="vtl-time">${st.time}</span>`:''}</div>
        <div class="vtl-sub">${st.sub}</div>
      </div>
    </div>`;
  }).join('')}</div>`;
}

function sv2Count(){
  const v=S.sv2, pf=STUDENT_PREFS[v.studentId]||{};
  let n;
  if(v.studentMode){
    const seed=((pf.program||'')+(pf.studyArea||'')+(pf.discipline||'')+(pf.duration||'')).length;
    n=180+seed*23+(pf.eligibility||'').length*7;
    if(v.course.trim()) n=Math.max(12,Math.round(n*0.35));
  } else {
    n=4820;
    if(v.course.trim()) n=Math.max(20,42+v.course.trim().length*17);
  }
  return n;
}

const FLOW_N=92;
function flowLinesSvg(){
  let flow='';
  for(let i=0;i<FLOW_N;i++){
    const op=(0.16+0.62*(0.5+0.5*Math.sin(i*1.35+0.6))).toFixed(2);
    const sw=(0.45+0.7*(0.5+0.5*Math.sin(i*0.8+2.1))).toFixed(2);
    flow+=`<path fill="none" stroke="#fff" stroke-opacity="${op}" stroke-width="${sw}" stroke-linecap="round"/>`;
  }
  return `<svg class="flowlines" viewBox="0 0 400 820" preserveAspectRatio="none">${flow}</svg>`;
}

let flowRAF=null;
function startFlow(){
  if(flowRAF!=null){ cancelAnimationFrame(flowRAF); flowRAF=null; }
  const W=400,H=820,sp=H/(FLOW_N-1);
  const tick=(now)=>{
    const svg=document.querySelector('.flowlines');
    if((!S.searching && S.auth!=='out')||!svg){ flowRAF=null; return; }
    const paths=svg.querySelectorAll('path');
    const t=now/1000;
    for(let i=0;i<paths.length;i++){
      const base=i*sp;
      let d='';
      for(let x=-20;x<=W+20;x+=12){
        const u=x/70;
        const y=base
          + 15*Math.sin(u*0.6 + t*0.35 + i*0.09)
          + 9*Math.sin(u*1.5 - t*0.8 + i*0.32)
          + 6*Math.sin(u*2.7 + t*1.15 + i*0.62)
          + 7*Math.sin(t*0.5 + i*0.22);
        d += (d?' L ':'M ')+x+' '+y.toFixed(1);
      }
      paths[i].setAttribute('d',d);
    }
    flowRAF=requestAnimationFrame(tick);
  };
  flowRAF=requestAnimationFrame(tick);
}
function searchCriteria(){
  const monthMap={'January, February, March':'Feb','April, May, June':'May','July, August, September':'Sep'};
  const parts=[];
  const area=S.searchVals['Study Area']||S.searchVals['Discipline Area'];
  parts.push(area||'All disciplines');
  parts.push(S.searchVals['Program Level']||'All levels');
  if(S.searchVals['Country']) parts.push(S.searchVals['Country']);
  parts.push(`${monthMap[S.searchIntake]||'Sep'} ${S.searchYear}`);
  return parts.join(' · ');
}

function toast(msg){
  const f=document.getElementById('frame'); if(!f) return;
  const old=f.querySelector('.toast'); if(old) old.remove();
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg; f.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; setTimeout(()=>t.remove(),320); }, 1700);
}
function popCart(){ const c=document.querySelector('.cart-btn'); if(c){ c.classList.remove('cart-pop'); void c.offsetWidth; c.classList.add('cart-pop'); } }
function shortlistFly(btn, id){
  const adding = !S.shortlist.includes(id);
  const srcEl = btn && (btn.querySelector('svg')||btn);
  const s = srcEl ? srcEl.getBoundingClientRect() : null;
  // toggle + re-render so the top count button appears / increments
  S.shortlist = S.shortlist.includes(id) ? S.shortlist.filter(x=>x!==id) : [...S.shortlist, id];
  render();
  if(!adding){ toast('Removed course from recommendations'); return; }
  if(!s) return;
  const cart = document.querySelector('.cart-btn'); if(!cart) return;
  const t = cart.getBoundingClientRect();
  const sx=s.left+s.width/2, sy=s.top+s.height/2, tx=t.left+t.width/2, ty=t.top+t.height/2;
  const fly=document.createElement('div'); fly.className='fly-dot';
  fly.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="#fff" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21 12 16.5 5 21V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>';
  fly.style.left=sx+'px'; fly.style.top=sy+'px';
  document.body.appendChild(fly);
  const lift=Math.min(sy,ty)-70;
  const anim=fly.animate([
    { transform:'translate(-50%,-50%) translate(0,0) scale(1)', opacity:1 },
    { transform:`translate(-50%,-50%) translate(${(tx-sx)*0.5}px, ${lift-sy}px) scale(1.12)`, opacity:.95, offset:.45 },
    { transform:`translate(-50%,-50%) translate(${tx-sx}px, ${ty-sy}px) scale(.28)`, opacity:.12 }
  ], { duration:640, easing:'cubic-bezier(.5,0,.7,1)' });
  const done=()=>{ fly.remove(); popCart(); };
  anim.onfinish=done; anim.oncancel=done;
  setTimeout(done, 800);
}

/* ---------- demo control bar ---------- */
function currentFlow(){
  if(S.auth==='out') return 'login';
  if(S.shareStep||S.shareSent) return 'share';
  if(S.notifOpen) return 'notifications';
  if(S.commentsAppId) return 'comments';
  if(S.detailId) return 'profile';
  if(S.tab==='search'&&S.searching) return 'splash';
  if(S.tab==='search'&&S.searchResults&&S.openProgram) return 'program';
  if(S.tab==='search'&&S.searchResults) return 'results';
  if(S.results2) return 'results2';
  if(S.tab==='searchv2') return 'searchv2';
  if(S.tab==='search') return 'search';
  if(S.tab==='applications') return 'applications';
  if(S.tab==='account') return 'account';
  if(S.tab==='students') return 'dashboard';
  return '';
}

function resetPush(){
  S.detailId=null; S.notifOpen=false; S.commentsAppId=null; S.studentAppsId=null; S.stub=null;
  S.shareStep=null; S.shareSent=null; S.recipientOpen=false; S.searchResults=false; S.searching=false; S.openProgram=null;
  S.addOpen=false; S.addAppOpen=false; S.eligibilityOpen=false; S.moreFiltersOpen=false; S.fabOpen=false;
  S.pendingDelete=null; S.deleted=null; S.addConfirm=null; S.appConfirm=null; S.nativeShareOpen=false; S.results2=false; S.sortFilterOpen=false;
  if(recTimer)clearInterval(recTimer); S.recState=null; S.recSecs=0;
}

/* ---------- actions ---------- */
function act(a,arg){
  switch(a){
    case 'tab': S.tab=arg; S.searchResults=false; S.searching=false; S.openProgram=null; S.fabOpen=false; S.studentAppsId=null; S.stub=null; break;
    // demo controls
    case 'setAuth': S.auth=arg; if(arg==='out') resetPush(); break;
    case 'signIn': S.auth='in'; resetPush(); S.tab='students'; break;
    case 'signOut': resetPush(); S.auth='out'; break;
    case 'setEmpty': S.empty=(arg==='on'); resetPush(); break;
    case 'sv2Toggle': S.sv2.studentMode=!S.sv2.studentMode; break;
    case 'sv2Student': S.sv2.studentId=arg; break;
    case 'sv2Search': S.results2=true; S.openProgram=null; S.eligibilityOpen=false; break;
    case 'openSortFilter': S.sortFilterOpen=true; break;
    case 'closeSortFilter': {
      const ov=document.querySelector('.overlay');
      if(ov){ ov.classList.add('closing'); setTimeout(()=>{ S.sortFilterOpen=false; render(); }, 250); return; }
      S.sortFilterOpen=false; break;
    }
    case 'setSort': S.sortBy=arg; patchSortFilter(); return;
    case 'rf2Country': { const i=S.rf2.countries.indexOf(arg); if(i>=0) S.rf2.countries.splice(i,1); else S.rf2.countries.push(arg); patchSortFilter(); return; }
    case 'rf2Toggle': S.rf2[arg]=!S.rf2[arg]; patchSortFilter(); return;
    case 'resetSortFilter': S.sortBy='Featured'; S.rf2={countries:[],scholarship:false,openIntakes:false}; patchSortFilter(); return;
    case 'applySortFilter': {
      const ov=document.querySelector('.overlay');
      if(ov){ ov.classList.add('closing'); setTimeout(()=>{ S.sortFilterOpen=false; render(); }, 250); return; }
      S.sortFilterOpen=false; break;
    }
    case 'openNativeShare': S.nativeShareOpen=true; break;
    case 'closeNativeShare': {
      const ov=document.querySelector('.overlay');
      if(ov){ ov.classList.add('closing'); setTimeout(()=>{ S.nativeShareOpen=false; render(); }, 250); return; }
      S.nativeShareOpen=false; break;
    }
    case 'nativeShareDo': {
      const ov=document.querySelector('.overlay');
      const done=()=>{ S.nativeShareOpen=false; render(); toast('Shared via '+arg); };
      if(ov){ ov.classList.add('closing'); setTimeout(done, 250); return; }
      done(); break;
    }
    case 'demoFlow': {
      resetPush(); S.auth='in';
      switch(arg){
        case 'login': S.auth='out'; break;
        case 'dashboard': S.tab='students'; break;
        case 'search': S.tab='search'; break;
        case 'searchv2': S.tab='searchv2'; break;
        case 'results2': S.tab='searchv2'; S.results2=true; break;
        case 'splash': S.tab='search'; S.searching=true; setTimeout(()=>{ if(S.searching){ S.searching=false; S.searchResults=true; render(); } }, 5000); break;
        case 'results': S.tab='search'; S.searchResults=true; break;
        case 'program': S.tab='search'; S.searchResults=true; S.openProgram=PROGRAMS[0].id; break;
        case 'share': S.tab='search'; S.searchResults=true; S.shortlist=PROGRAMS.slice(0,3).map(p=>p.id); S.shareStep='curated'; break;
        case 'applications': S.tab='applications'; break;
        case 'comments': { const ap=appsAll()[0]; if(ap){ S.commentsAppId=ap.id; S.draft=''; } else { S.tab='applications'; } break; }
        case 'profile': { const st=visibleStudents()[0]; if(st){ S.detailId=st.id; } else { S.tab='students'; } break; }
        case 'notifications': S.tab='students'; S.notifOpen=true; break;
        case 'account': S.tab='account'; break;
      }
      break;
    }
    case 'openNotifs': S.notifOpen=true; break;
    case 'closeNotifs': {
      const el=document.querySelector('.screen-push');
      if(el){ el.classList.add('closing'); setTimeout(()=>{ S.notifOpen=false; render(); }, 240); return; }
      S.notifOpen=false; break;
    }

    case 'openNotif': { const n=S.notifs.find(x=>x.id===arg); if(n){ n.read=true; if(n.appId){ S.notifOpen=false; S.commentsAppId=n.appId; S.draft=''; } } break; }

      S.eligibilityOpen=false; break;
    }
    case 'openShareMenu': S.shareStep='menu'; break;
    case 'closeShare': S.shareStep=null; break;
    case 'shareReview': S.shareStep='review'; break;
    case 'shareCurated': S.shareStep='curated'; break;
    case 'openRecipient': S.recipientOpen=true; break;
    case 'closeRecipient': S.recipientOpen=false; break;
    case 'doShare': {
      let name='New student';
      if(S.recipMode==='existing'){ name=S.students.find(s=>s.id===S.recipStudent)?.name||'Student'; }
      else { name=(document.getElementById('rn')?.value||'').trim()||'New student'; }
      S.shareSent={recipient:name,method:arg}; S.recipientOpen=false; break; }
    case 'shareDone': S.shareStep=null; S.recipientOpen=false; S.shareSent=null; S.searchResults=false; break;
    case 'selBookmark': S.selBookmarkStudent=arg; break;
    case 'removeBookmark': S.bookmarks[S.selBookmarkStudent]=(S.bookmarks[S.selBookmarkStudent]||[]).filter(x=>x!==arg); break;
  }
  render();
}
window.act=act; window.onStuSearch=onStuSearch; window.onSv2Course=onSv2Course; window.onDraft=onDraft; window.setAdd=setAdd; window.setAssign=setAssign; window.setRecipMode=setRecipMode; window.sendComment=sendComment; window.pickDocs=pickDocs; window.pickComment=pickComment; window.shortlistFly=shortlistFly; window.S=S;

render();
</script>
</body>
